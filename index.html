<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>บันทึกเวลาคลินิกบ้านฮักดี</title>

    <!-- Google Fonts: Noto Sans Thai -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        body {
            font-family: 'Noto Sans Thai', sans-serif;
            /* พื้นหลังไล่สีโทน Ocean Blue */
            background: linear-gradient(135deg, #0f172a, #1e3a8a, #0284c7, #38bdf8);
            background-size: 300% 300%;
            animation: gradientBG 15s ease infinite;
            min-height: 100vh;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* กล่องสไตล์ Glassmorphism */
        .glass-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.2);
        }

        .glass-input {
            background: rgba(255, 255, 255, 0.8);
            border: 2px solid transparent;
            transition: all 0.3s ease;
        }

        .glass-input:focus {
            background: #ffffff;
            border-color: #38bdf8;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
            outline: none;
        }

        .btn-hover-effect {
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .btn-hover-effect:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body class="flex items-center justify-center p-4 text-gray-800">

    <main class="glass-card w-full max-w-md rounded-[2.5rem] p-8 text-center relative overflow-hidden">
        
        <!-- Decoration Blur -->
        <div class="absolute -top-20 -left-20 w-40 h-40 bg-sky-400 rounded-full mix-blend-multiply filter blur-2xl opacity-50"></div>
        <div class="absolute -bottom-20 -right-20 w-40 h-40 bg-blue-500 rounded-full mix-blend-multiply filter blur-2xl opacity-50"></div>

        <header class="relative z-10 mb-6">
            <div class="inline-flex items-center justify-center w-20 h-20 bg-white/20 rounded-3xl backdrop-blur-sm shadow-inner mb-4">
                <i class="fa-solid fa-house-medical text-4xl text-white drop-shadow-md"></i>
            </div>
            <h1 class="text-2xl font-bold text-white tracking-wide drop-shadow">คลินิกบ้านฮักดี</h1>
            <p class="text-sky-100 text-sm mt-1">ระบบบันทึกเวลาเข้า-ออกงาน</p>
        </header>

        <section class="relative z-10 mb-8 bg-white/20 rounded-2xl p-4 backdrop-blur-sm border border-white/20 text-white shadow-inner">
            <div id="currentDate" class="text-sky-100 text-sm font-medium mb-1">กำลังโหลดวันที่...</div>
            <div id="currentTime" class="text-4xl font-bold tracking-wider drop-shadow-md">00:00:00</div>
        </section>

        <section class="relative z-10 space-y-5">
            <div class="relative">
                <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                    <i class="fa-regular fa-id-badge text-sky-500 text-lg"></i>
                </div>
                <input type="text" id="empId" placeholder="กรอกรหัสพนักงาน" 
                    class="glass-input w-full pl-12 pr-4 py-4 rounded-2xl text-lg font-semibold text-gray-700 placeholder-gray-400 text-center uppercase shadow-sm"
                    autocomplete="off">
            </div>

            <div class="grid grid-cols-2 gap-4">
                <button onclick="recordTime('เข้างาน')" 
                    class="btn-hover-effect bg-gradient-to-r from-cyan-400 to-teal-400 hover:from-cyan-500 hover:to-teal-500 text-white font-bold py-4 px-4 rounded-2xl shadow-lg shadow-cyan-500/30 border border-white/20">
                    <i class="fa-solid fa-right-to-bracket mb-1 text-xl block"></i>
                    เข้างาน
                </button>
                
                <button onclick="recordTime('เลิกงาน')" 
                    class="btn-hover-effect bg-gradient-to-r from-blue-500 to-indigo-500 hover:from-blue-600 hover:to-indigo-600 text-white font-bold py-4 px-4 rounded-2xl shadow-lg shadow-blue-500/30 border border-white/20">
                    <i class="fa-solid fa-right-from-bracket mb-1 text-xl block"></i>
                    เลิกงาน
                </button>
            </div>
        </section>

        <!-- ปุ่มติดตั้งแอปลงหน้าจอ -->
        <footer class="relative z-10 mt-8 pt-4 border-t border-white/20">
            <button onclick="showInstallGuide()" class="text-white/80 hover:text-white text-sm flex items-center justify-center w-full transition-colors">
                <i class="fa-solid fa-arrow-up-right-from-square mr-2"></i>
                ติดตั้งแอปลงหน้าจอมือถือ
            </button>
            <p class="text-white/50 text-[10px] mt-3">Powered by 2026 Hug Dee Home Clinic</p>
        </footer>
    </main>

    <script>
        // 🚨 อัปเดต URL ล่าสุดของ Apps Script ของคุณที่นี่ (ถ้าเพิ่ง Deploy ใหม่ให้นำมาเปลี่ยน)
        const GAS_URL = "https://script.google.com/macros/s/AKfycbwx65S4ku8kpACd5KzgWC077MaOb8pVqdUlvZWjJc7iDaoEoFteHLxuiMHI_zeu_qht/exec";

        // ==========================================
        // 1. ระบบนาฬิกาและวันที่
        // ==========================================
        function updateClock() {
            const now = new Date();
            
            const timeStr = now.toLocaleTimeString('th-TH', { 
                hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false 
            });
            document.getElementById('currentTime').textContent = timeStr;

            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('currentDate').textContent = now.toLocaleDateString('th-TH', options);
        }
        setInterval(updateClock, 1000);
        updateClock();

        // ==========================================
        // 2. บังคับพิมพ์ใหญ่ในช่องกรอก (Auto Uppercase)
        // ==========================================
        const empIdInput = document.getElementById('empId');
        empIdInput.addEventListener('input', function() {
            this.value = this.value.toUpperCase();
        });

        // ==========================================
        // 3. ฟังก์ชันหลักสำหรับบันทึกข้อมูล
        // ==========================================
        async function recordTime(status) {
            const empId = empIdInput.value.trim();

            if (!empId) {
                Swal.fire({
                    icon: 'warning',
                    title: 'กรุณากรอกรหัสพนักงาน',
                    text: 'ต้องระบุรหัสพนักงานก่อนทำรายการ',
                    confirmButtonColor: '#0ea5e9',
                    customClass: { popup: 'rounded-[2rem]' }
                });
                return;
            }

            // แสดง Loading
            Swal.fire({
                title: 'กำลังดึงพิกัดตำแหน่ง...',
                text: 'กรุณารอสักครู่',
                allowOutsideClick: false,
                didOpen: () => { Swal.showLoading(); },
                customClass: { popup: 'rounded-[2rem]' }
            });

            // ขอพิกัด GPS
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => { sendData(position.coords.latitude, position.coords.longitude, empId, status); },
                    (error) => {
                        let errorMsg = "ไม่สามารถดึงตำแหน่งได้";
                        if (error.code === 1) errorMsg = "คุณไม่อนุญาตให้เข้าถึงตำแหน่งที่ตั้ง (Location)";
                        Swal.fire({
                            icon: 'error',
                            title: 'เกิดข้อผิดพลาด',
                            text: errorMsg,
                            confirmButtonColor: '#ef4444',
                            customClass: { popup: 'rounded-[2rem]' }
                        });
                    },
                    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
                );
            } else {
                Swal.fire('ข้อผิดพลาด', 'เบราว์เซอร์ของคุณไม่รองรับการระบุตำแหน่ง', 'error');
            }
        }

        async function sendData(latitude, longitude, empId, status) {
            Swal.fire({
                title: 'กำลังบันทึกข้อมูล...',
                allowOutsideClick: false,
                didOpen: () => { Swal.showLoading(); },
                customClass: { popup: 'rounded-[2rem]' }
            });

            const now = new Date();
            const dateStr = now.toLocaleDateString('th-TH');
            const timeStr = now.toLocaleTimeString('th-TH', { hour12: false });

            try {
                // สร้างข้อมูลที่จะส่ง
                const payload = {
                    date: dateStr,
                    time: timeStr,
                    empId: empId,
                    status: status,
                    lat: latitude,
                    lng: longitude
                };

                // ส่งข้อมูลด้วย mode: 'no-cors' เพื่อไม่ให้เบราว์เซอร์บล็อกเมื่อ Google ตอบกลับ
                // ข้อจำกัดคือเราจะไม่สามารถอ่านข้อความตอบกลับจาก Google ได้ แต่ข้อมูลจะเข้า Sheet
                await fetch(GAS_URL, {
                    method: "POST",
                    mode: "no-cors",
                    headers: {
                        "Content-Type": "text/plain;charset=utf-8",
                    },
                    body: JSON.stringify(payload)
                });

                // หากโค้ดรันมาถึงบรรทัดนี้โดยไม่เข้า catch ถือว่าส่งคำสั่งไปยัง Google สำเร็จ
                Swal.fire({
                    icon: 'success',
                    title: `บันทึก${status}สำเร็จ!`,
                    text: `รหัส: ${payload.empId} | เวลา: ${payload.time}`,
                    confirmButtonColor: '#0ea5e9',
                    customClass: { popup: 'rounded-[2rem]' }
                });

                empIdInput.value = ''; // เคลียร์ช่องกรอกรหัส

            } catch (error) {
                console.error("Error:", error);
                
                // จะเข้า catch เมื่อเกิด Network Error เท่านั้น (เช่น อินเทอร์เน็ตหลุด)
                Swal.fire({
                    icon: 'error',
                    title: 'เชื่อมต่อล้มเหลว!',
                    html: `<p class="text-sm">ไม่สามารถส่งข้อมูลได้ กรุณาตรวจสอบอินเทอร์เน็ตของคุณ<br>หรือติดต่อผู้ดูแลระบบ</p>`,
                    confirmButtonColor: '#0ea5e9',
                    customClass: { popup: 'rounded-[2rem]' }
                });
            }
        }

        // ==========================================
        // 4. ฟังก์ชันแนะนำการติดตั้งลงหน้าจอ
        // ==========================================
        function showInstallGuide() {
            Swal.fire({
                title: '<span class="text-sky-600">วิธีติดตั้งแอป</span>',
                html: `
                    <div class="text-left text-sm space-y-4 text-gray-600">
                        <div class="bg-sky-50 p-3 rounded-xl border border-sky-100">
                            <p class="font-bold text-sky-700 mb-1"><i class="fab fa-apple mr-1"></i> สำหรับ iOS (Safari):</p>
                            <p>1. แตะไอคอน <i class="fa-solid fa-arrow-up-from-bracket mx-1 border rounded px-1"></i> (Share) ด้านล่าง</p>
                            <p>2. เลือก <b>"เพิ่มไปยังหน้าจอโฮม" (Add to Home Screen)</b></p>
                        </div>
                        <div class="bg-blue-50 p-3 rounded-xl border border-blue-100">
                            <p class="font-bold text-blue-700 mb-1"><i class="fab fa-android mr-1"></i> สำหรับ Android (Chrome):</p>
                            <p>1. แตะไอคอน <i class="fa-solid fa-ellipsis-vertical mx-1"></i> (3 จุด) มุมขวาบน</p>
                            <p>2. เลือก <b>"เพิ่มลงในหน้าจอหลัก" (Add to Home Screen)</b></p>
                        </div>
                    </div>
                `,
                confirmButtonText: 'เข้าใจแล้ว',
                confirmButtonColor: '#0ea5e9',
                customClass: { popup: 'rounded-[2rem]' }
            });
        }
    </script>
</body>
</html>
